<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart of Accounts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=3">
</head>

<body class="coa-page">
    <nav class="navbar navbar-expand-lg sticky-top mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <img src="img/logo2.png" alt="Logo" class="navbar-logo">
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <span class="bi bi-list text-white fs-1"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html"><i
                                class="bi bi-speedometer2"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="accounts.html"><i
                                class="bi bi-list-columns-reverse"></i>Accounts</a></li>
                    <li class="nav-item"><a class="nav-link" href="journal.html"><i
                                class="bi bi-plus-circle"></i>Journal</a></li>
                    <li class="nav-item"><a class="nav-link" href="reports.html"><i
                                class="bi bi-file-earmark-bar-graph"></i>Reports</a></li>
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                        <a class="btn btn-red btn-sm w-100" href="#" onclick="api.logout()">
                            <i class="bi bi-box-arrow-right me-2"></i>LOGOUT
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="coa-shell">
            <div class="coa-header">
                <h1 class="coa-title">Chart of Accounts</h1>
                <button class="btn btn-navy">
                    <i class="bi bi-plus-lg me-2"></i>New Account
                </button>
            </div>

            <div class="coa-table-wrap">
                <table class="coa-table" aria-label="Chart of Accounts">
                    <colgroup>
                        <col style="width: 20%;">
                        <col style="width: 20%;">
                        <col style="width: 20%;">
                        <col style="width: 20%;">
                        <col style="width: 20%;">
                    </colgroup>
                    <thead>
                        <tr>
                            <th>Account Code</th>
                            <th>Account Name</th>
                            <th>Type</th>
                            <th>Normal Balance</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="coa-code">1000</td>
                            <td>Cash</td>
                            <td><span class="badge-soft badge-soft-asset">Asset</span></td>
                            <td><span class="pill-balance pill-debit">Debit</span></td>
                            <td class="coa-actions">
                                <button class="btn btn-table-action" aria-label="Edit Cash">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-table-action btn-table-action-delete" aria-label="Delete Cash">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                        <tr>
                            <td class="coa-code">2000</td>
                            <td>Accounts Payable</td>
                            <td><span class="badge-soft badge-soft-liability">Liability</span></td>
                            <td><span class="pill-balance pill-credit">Credit</span></td>
                            <td class="coa-actions">
                                <button class="btn btn-table-action" aria-label="Edit Accounts Payable">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-table-action btn-table-action-delete"
                                    aria-label="Delete Accounts Payable">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                        <tr>
                            <td class="coa-code">3000</td>
                            <td>Owner's Equity</td>
                            <td><span class="badge-soft badge-soft-equity">Equity</span></td>
                            <td><span class="pill-balance pill-credit">Credit</span></td>
                            <td class="coa-actions">
                                <button class="btn btn-table-action" aria-label="Edit Owner's Equity">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-table-action btn-table-action-delete"
                                    aria-label="Delete Owner's Equity">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                        <tr>
                            <td class="coa-code">4000</td>
                            <td>Sales Revenue</td>
                            <td><span class="badge-soft badge-soft-revenue">Revenue</span></td>
                            <td><span class="pill-balance pill-credit">Credit</span></td>
                            <td class="coa-actions">
                                <button class="btn btn-table-action" aria-label="Edit Sales Revenue">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-table-action btn-table-action-delete"
                                    aria-label="Delete Sales Revenue">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                        <tr>
                            <td class="coa-code">5000</td>
                            <td>Office Supplies</td>
                            <td><span class="badge-soft badge-soft-expense">Expense</span></td>
                            <td><span class="pill-balance pill-debit">Debit</span></td>
                            <td class="coa-actions">
                                <button class="btn btn-table-action" aria-label="Edit Office Supplies">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-table-action btn-table-action-delete"
                                    aria-label="Delete Office Supplies">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
