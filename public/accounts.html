<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart of Accounts</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=6">
    <style>
        .page-title {
            color: var(--navy-blue);
            font-weight: 800;
            font-size: 2.2rem;
            letter-spacing: -0.8px;
            text-transform: none;
        }

        .custom-table-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .custom-table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            background-color: #ffffff;
            border-radius: 12px;
            /* Softened radius */
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            /* Softer, deeper shadow */
            table-layout: fixed;
        }

        .custom-table thead th {
            background-color: var(--navy-blue) !important;
            color: var(--white) !important;
            padding: 0.85rem 1rem !important;
            /* Increased for professional spacing */
            text-transform: uppercase;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.8px;
            /* Improved readability */
            border-bottom: 3px solid var(--golden) !important;
            vertical-align: middle;
            text-align: left;
            white-space: nowrap;
        }

        /* Specific header overrides */
        .custom-table thead th.text-end {
            text-align: right !important;
        }

        .custom-table thead th.text-center {
            text-align: center !important;
        }

        .custom-table tbody tr {
            background-color: #ffffff;
            transition: all 0.2s ease;
        }

        .custom-table tbody tr:nth-child(even) {
            background-color: #f8f9fa;
            /* Lighter alternate row */
        }

        .custom-table tbody tr:hover {
            background-color: #fff8e1 !important;
            /* Very subtle golden lint */
            transform: translateY(-1px);
            /* Micro-interaction */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            position: relative;
            z-index: 1;
        }

        .custom-table tbody td {
            color: var(--navy-dark);
            padding: 0.8rem 1rem !important;
            /* Consistent, breathable padding */
            border-bottom: 1px solid #f0f0f0;
            /* Softer border */
            font-weight: 500;
            font-size: 0.9rem;
            /* Slightly larger for readability */
            vertical-align: middle;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: left;
        }

        .custom-table .fw-mono {
            color: var(--navy-blue) !important;
            font-weight: 600;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.85rem;
            letter-spacing: -0.5px;
        }

        /* Compact Badge Overrides */
        .custom-table .badge-soft {
            padding: 0.35rem 0.75rem !important;
            font-size: 0.75rem !important;
            font-weight: 600;
            border-radius: 6px;
        }

        .custom-table .pill-balance {
            padding: 0.3rem 0.75rem !important;
            font-size: 0.7rem !important;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .custom-table .btn-link {
            padding: 0.2rem !important;
            color: var(--navy-light);
            text-decoration: none;
            transition: all 0.2s ease;
            opacity: 0.8;
        }

        .custom-table .btn-link:hover {
            transform: scale(1.15);
            color: var(--navy-blue);
            opacity: 1;
        }

        .custom-table .btn-link.text-danger:hover {
            color: #dc3545;
        }

        /* Column Widths - Percentage based for 1100px Layout */
        .col-code {
            width: 15%;
            text-align: left;
        }

        .col-name {
            width: 35%;
            text-align: left;
        }

        .col-type {
            width: 15%;
            text-align: left;
        }

        .col-balance {
            width: 15%;
            text-align: left;
        }

        .col-actions {
            width: 20%;
            text-align: right;
        }

        /* More room for actions */

        @media (max-width: 992px) {
            .col-code {
                width: 18%;
            }

            .col-name {
                width: 32%;
            }

            .col-type {
                width: 15%;
            }

            .col-balance {
                width: 15%;
            }

            .col-actions {
                width: 20%;
            }
        }

        @media (max-width: 768px) {
            .col-code {
                width: 20%;
            }

            .col-name {
                width: auto;
            }

            .col-type {
                display: none;
            }

            .col-balance {
                width: 25%;
            }

            .col-actions {
                width: 15%;
            }

            .custom-table-container {
                padding: 0;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg sticky-top mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <img src="img/logo2.png" alt="Logo" class="navbar-logo">
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="bi bi-list text-white fs-1"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html"><i
                                class="bi bi-speedometer2"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="accounts.html"><i
                                class="bi bi-list-columns-reverse"></i>Accounts</a></li>
                    <li class="nav-item"><a class="nav-link" href="journal.html"><i
                                class="bi bi-plus-circle"></i>Journal</a></li>
                    <li class="nav-item"><a class="nav-link" href="reports.html"><i
                                class="bi bi-file-earmark-bar-graph"></i>Reports</a></li>
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                        <a class="btn btn-red btn-sm w-100" href="#" onclick="api.logout()">
                            <i class="bi bi-box-arrow-right me-2"></i>LOGOUT
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container-fluid px-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-3 pt-1">
            <div>
                <h1 class="page-title mb-0">Chart of Accounts</h1>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-navy btn-sm px-4" onclick="openAccountModal()">
                    <i class="bi bi-plus-lg me-1"></i> New Account
                </button>
            </div>
        </div>

        <div class="card border-0 shadow-sm mb-3">
            <div class="card-body py-2 px-3">
                <div class="row g-2">
                    <div class="col-md-4">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-white border-end-0"><i
                                    class="bi bi-search text-muted"></i></span>
                            <input type="text" id="account-search" class="form-control border-start-0 ps-0"
                                placeholder="Filter by name or code..." onkeyup="filterAccounts()">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <select id="filter-type" class="form-select form-select-sm" onchange="filterAccounts()">
                            <option value="">All Account Types</option>
                            <option value="Asset">Assets</option>
                            <option value="Liability">Liabilities</option>
                            <option value="Equity">Equity</option>
                            <option value="Revenue">Revenue</option>
                            <option value="Expense">Expenses</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="custom-table-container">
            <div class="card border-0 shadow-sm overflow-hidden">
                <div class="table-responsive">
                    <table id="accounts-table" class="custom-table align-middle mb-0">
                        <thead>
                            <tr>
                                <th class="col-code ps-4">Account Code</th>
                                <th class="col-name">Account Name</th>
                                <th class="col-type text-center">Type</th>
                                <th class="col-balance text-center">Normal Balance</th>
                                <th class="col-actions text-end pe-4">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Accounts will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Account Modal (Add/Edit) -->
    <div class="modal fade" id="accountModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-navy text-white py-3">
                    <h5 class="modal-title fw-bold" id="accountModalTitle">Add Account</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="account-form">
                    <div class="modal-body p-4">
                        <input type="hidden" id="account-id" value="">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label mb-1">Account Code</label>
                                <input type="text" id="account-code" class="form-control" placeholder="e.g. 1001"
                                    required maxlength="10">
                            </div>
                            <div class="col-md-8">
                                <label class="form-label mb-1">Account Name</label>
                                <input type="text" id="account-name" class="form-control"
                                    placeholder="e.g. Cash in Bank" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label mb-1">Account Type</label>
                                <select id="account-type" class="form-select" required onchange="updateNormalBalance()">
                                    <option value="" disabled selected>Select type...</option>
                                    <option value="Asset">Asset</option>
                                    <option value="Liability">Liability</option>
                                    <option value="Equity">Equity</option>
                                    <option value="Revenue">Revenue</option>
                                    <option value="Expense">Expense</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label mb-1">Normal Balance</label>
                                <select id="account-normal-balance" class="form-select" required>
                                    <option value="" disabled selected>Select...</option>
                                    <option value="Debit">Debit</option>
                                    <option value="Credit">Credit</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label mb-1">Description</label>
                                <textarea id="account-description" class="form-control" rows="2"
                                    placeholder="Account purpose or details..."></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-top-0 p-4 pt-0">
                        <button type="button" class="btn btn-outline-secondary px-4"
                            data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-navy px-4">Save Account</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        const typeNormalBalance = { Asset: 'Debit', Liability: 'Credit', Equity: 'Credit', Revenue: 'Credit', Expense: 'Debit' };
        let allAccounts = [];

        function updateNormalBalance() {
            const type = document.getElementById('account-type').value;
            if (type) document.getElementById('account-normal-balance').value = typeNormalBalance[type];
        }

        async function editAccount(id) {
            try {
                const account = await api.get('/accounts/' + id);
                openAccountModal(account);
            } catch (err) {
                api.showToast(err.message, 'error');
            }
        }

        function openAccountModal(account = null) {
            document.getElementById('accountModalTitle').innerText = account ? 'Edit Account' : 'New Account';
            document.getElementById('account-id').value = account ? account.id : '';
            document.getElementById('account-code').value = account ? account.code : '';
            document.getElementById('account-code').readOnly = !!account;
            document.getElementById('account-name').value = account ? account.name : '';
            document.getElementById('account-type').value = account ? account.type : '';
            document.getElementById('account-normal-balance').value = account ? account.normal_balance : '';
            document.getElementById('account-description').value = account ? (account.description || '') : '';

            const modal = new bootstrap.Modal(document.getElementById('accountModal'));
            modal.show();
        }

        async function deleteAccount(id) {
            if (!confirm('Are you sure you want to delete this account? This action cannot be undone if there are transactions.')) return;
            try {
                await api.delete('/accounts/' + id);
                api.showToast('Account deleted successfully', 'success');
                loadAccounts();
            } catch (err) {
                api.showToast(err.message, 'error');
            }
        }

        function filterAccounts() {
            const searchTerm = document.getElementById('account-search').value.toLowerCase();
            const filterType = document.getElementById('filter-type').value;

            const filtered = allAccounts.filter(a => {
                const matchesSearch = a.name.toLowerCase().includes(searchTerm) || a.code.toLowerCase().includes(searchTerm);
                const matchesType = !filterType || a.type === filterType;
                return matchesSearch && matchesType;
            });

            renderAccounts(filtered);
        }

        function renderAccounts(accounts) {
            const tbody = document.querySelector('#accounts-table tbody');
            if (accounts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-5">No accounts found matching your criteria.</td></tr>';
                return;
            }

            tbody.innerHTML = accounts.map(a => `
                <tr>
                    <td class="ps-4 fw-mono small">${a.code}</td>
                    <td>
                        <div class="fw-semibold text-navy">${a.name}</div>
                        ${a.description ? `<div class="small text-muted text-truncate" style="max-width: 400px;">${a.description}</div>` : ''}
                    </td>
                    <td class="text-center">
                        <span class="badge-soft badge-soft-${a.type.toLowerCase()}">${a.type}</span>
                    </td>
                    <td class="text-center">
                        <span class="pill-balance pill-${a.normal_balance.toLowerCase()}">${a.normal_balance}</span>
                    </td>
                    <td class="text-end pe-4">
                        <div class="d-flex gap-3 justify-content-end">
                            <button class="btn btn-link text-navy p-0" title="Edit" onclick="editAccount(${a.id})">
                                <i class="bi bi-pencil-square fs-6"></i>
                            </button>
                            <button class="btn btn-link text-danger p-0" title="Delete" onclick="deleteAccount(${a.id})">
                                <i class="bi bi-trash3 fs-6"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function loadAccounts() {
            try {
                const tbody = document.querySelector('#accounts-table tbody');
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-5"><div class="spinner-border spinner-border-sm text-navy" role="status"></div> Loading...</td></tr>';

                allAccounts = await api.get('/accounts');
                filterAccounts(); // Initial render with filters
            } catch (err) {
                api.showToast(err.message, 'error');
                document.querySelector('#accounts-table tbody').innerHTML = '<tr><td colspan="5" class="text-center text-muted py-5">Failed to load accounts.</td></tr>';
            }
        }

        document.getElementById('account-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('account-id').value;
            const data = {
                code: document.getElementById('account-code').value.trim(),
                name: document.getElementById('account-name').value.trim(),
                type: document.getElementById('account-type').value,
                normal_balance: document.getElementById('account-normal-balance').value,
                description: document.getElementById('account-description').value.trim() || null
            };
            try {
                if (id) {
                    await api.put('/accounts/' + id, data);
                    api.showToast('Account updated successfully', 'success');
                } else {
                    await api.post('/accounts', data);
                    api.showToast('Account added successfully', 'success');
                }
                bootstrap.Modal.getInstance(document.getElementById('accountModal')).hide();
                loadAccounts();
            } catch (err) {
                api.showToast(err.message, 'error');
            }
        };

        loadAccounts();
    </script>
</body>

</html>
