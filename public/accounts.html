<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart of Accounts | Financial Accounting</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=8">
    <style>
        /* Modern SaaS Design System - QuickBooks Inspired */
        :root {
            --bg-primary: #f7f8fa;
            --bg-card: #ffffff;
            --border-light: #e8eaed;
            --text-primary: #1a1a1a;
            --text-secondary: #5f6368;
            --text-muted: #9aa0a6;
            --accent-green: #0d9f6e;
            --accent-green-light: #def7ec;
            --accent-blue: #1a73e8;
            --accent-blue-light: #e8f0fe;
            --accent-purple: #7c3aed;
            --accent-purple-light: #ede9fe;
            --accent-orange: #f59e0b;
            --accent-orange-light: #fef3c7;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            /* Theme overrides based on requirements */
            --qb-navy: #003366;
            --qb-golden: #FFD700;
        }

        body {
            background-color: var(--bg-primary);
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            margin: 0;
            padding: 0;
        }

        .page-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Page Header */
        .page-header {
            padding: 32px 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--qb-navy);
            margin: 0;
            letter-spacing: -0.5px;
        }

        /* Action Buttons */
        .btn-new-account {
            background-color: var(--qb-navy);
            color: var(--white);
            border: none;
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .btn-new-account:hover {
            background-color: var(--navy-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
            color: var(--white);
        }

        /* Table Card Container */
        .table-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            margin-bottom: 40px;
        }

        /* Standard HTML Table with Fixed Layout */
        .qb-table {
            width: 100%;
            table-layout: fixed;
            /* Requirement: Perfect alignment */
            border-collapse: collapse;
        }

        .qb-table thead {
            background-color: var(--qb-navy);
            border-bottom: 2px solid var(--qb-golden);
            /* Requirement: Thin golden underline */
        }

        .qb-table thead th {
            background-color: var(--qb-navy) !important;
            color: #ffffff !important;
            padding: 14px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            text-align: center;
            border-bottom: 2px solid var(--qb-golden) !important;
        }

        .qb-table tbody tr {
            border-bottom: 1px solid #f1f3f4;
            transition: background-color 0.15s ease;
        }

        /* Alternating row colors */
        .qb-table tbody tr:nth-child(even) {
            background-color: #fafbfc;
        }

        .qb-table tbody tr:hover {
            background-color: #f1f3f5;
            /* Requirement: light gray hover */
        }

        .qb-table tbody td {
            padding: 16px 20px;
            font-size: 1rem;
            /* Requirement: increased readability */
            color: var(--text-primary);
            vertical-align: middle;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Column Widths (Equalized as requested) */
        .col-code {
            width: 20%;
        }

        .col-name {
            width: 20%;
        }

        .col-type {
            width: 20%;
        }

        .col-balance {
            width: 20%;
        }

        .col-actions {
            width: 20%;
            text-align: center !important;
        }

        /* Soft Badges for Type */
        .type-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: capitalize;
        }

        .type-badge.asset {
            background: #def7ec;
            color: #03543f;
        }

        .type-badge.liability {
            background: #fde8e8;
            color: #9b1c1c;
        }

        .type-badge.equity {
            background: #e1effe;
            color: #1e429f;
        }

        .type-badge.revenue {
            background: #fef3c7;
            color: #92400e;
        }

        .type-badge.expense {
            background: #edf2f7;
            color: #2d3748;
        }

        /* Rounded Pills for Normal Balance */
        .balance-pill {
            display: inline-flex;
            align-items: center;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .balance-pill.debit {
            background: #eafaf1;
            color: #27ae60;
            border: 1px solid #d4efdf;
        }

        .balance-pill.credit {
            background: #fef5f5;
            color: #e74c3c;
            border: 1px solid #fadbd8;
        }

        /* Action Icons */
        .action-icons {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .action-btn {
            color: var(--text-muted);
            font-size: 1.1rem;
            transition: color 0.2s;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
        }

        .action-btn:hover {
            color: var(--qb-navy);
        }

        .action-btn.delete:hover {
            color: #e24c4c;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .qb-table {
                table-layout: auto;
                /* Allow flexibility on smaller screens but keep requirements for desktop */
            }
        }
    </style>
</head>

<body>
    <!-- Main Navigation (Reused from existing system) -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <img src="img/logo2.png" alt="Logo" class="navbar-logo">
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="bi bi-list text-white fs-1"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html"><i
                                class="bi bi-speedometer2"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="accounts.html"><i
                                class="bi bi-list-columns-reverse"></i>Accounts</a></li>
                    <li class="nav-item"><a class="nav-link" href="journal.html"><i
                                class="bi bi-plus-circle"></i>Journal</a></li>
                    <li class="nav-item"><a class="nav-link" href="reports.html"><i
                                class="bi bi-file-earmark-bar-graph"></i>Reports</a></li>
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                        <a class="btn btn-red btn-sm w-100" href="#" onclick="api.logout()">
                            <i class="bi bi-box-arrow-right me-2"></i>LOGOUT
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="page-container">
        <!-- Page Header -->
        <div class="page-header">
            <h1>Chart of Accounts</h1>
            <button class="btn btn-new-account" onclick="openAccountModal()">
                <i class="bi bi-plus-lg me-2"></i>New Account
            </button>
        </div>

        <!-- Filter Bar -->
        <div class="card mb-4 border-0 shadow-sm" style="border-radius: 10px;">
            <div class="card-body p-3">
                <div class="row g-3 align-items-center">
                    <div class="col-md-6">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0">
                                <i class="bi bi-search text-muted"></i>
                            </span>
                            <input type="text" id="account-search" class="form-control border-start-0 ps-0"
                                placeholder="Search by name or code..." onkeyup="filterAccounts()">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <select id="filter-type" class="form-select" onchange="filterAccounts()">
                            <option value="">All Account Types</option>
                            <option value="Asset">Assets</option>
                            <option value="Liability">Liabilities</option>
                            <option value="Equity">Equity</option>
                            <option value="Revenue">Revenue</option>
                            <option value="Expense">Expenses</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Table Container -->
        <div class="table-card">
            <div class="table-responsive">
                <table class="qb-table" id="accounts-table">
                    <thead>
                        <tr>
                            <th class="col-code">Account Code</th>
                            <th class="col-name">Account Name</th>
                            <th class="col-type">Type</th>
                            <th class="col-balance">Normal Balance</th>
                            <th class="col-actions">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="accountsTableBody">
                        <!-- Accounts will be loaded dynamically here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Account Modal -->
    <div class="modal fade" id="accountModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 12px;">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold" id="accountModalTitle" style="color: var(--qb-navy);">Add Account
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="account-form">
                    <div class="modal-body p-4">
                        <input type="hidden" id="account-id" value="">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label fw-600 x-small text-muted text-uppercase mb-1">Code</label>
                                <input type="text" id="account-code" class="form-control" placeholder="1001" required>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label fw-600 x-small text-muted text-uppercase mb-1">Account
                                    Name</label>
                                <input type="text" id="account-name" class="form-control"
                                    placeholder="e.g. Cash in Bank" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-600 x-small text-muted text-uppercase mb-1">Account
                                    Type</label>
                                <select id="account-type" class="form-select" required onchange="updateNormalBalance()">
                                    <option value="" disabled selected>Select...</option>
                                    <option value="Asset">Asset</option>
                                    <option value="Liability">Liability</option>
                                    <option value="Equity">Equity</option>
                                    <option value="Revenue">Revenue</option>
                                    <option value="Expense">Expense</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-600 x-small text-muted text-uppercase mb-1">Normal
                                    Balance</label>
                                <select id="account-normal-balance" class="form-select" required>
                                    <option value="" disabled selected>Select...</option>
                                    <option value="Debit">Debit</option>
                                    <option value="Credit">Credit</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-600 x-small text-muted text-uppercase mb-1">Description
                                    (Optional)</label>
                                <textarea id="account-description" class="form-control" rows="2"
                                    placeholder="Brief description..."></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-top-0 pt-0 pb-4 px-4">
                        <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn text-white px-4" style="background-color: var(--qb-navy);">Save
                            Account</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        const typeNormalBalance = {
            Asset: 'Debit',
            Liability: 'Credit',
            Equity: 'Credit',
            Revenue: 'Credit',
            Expense: 'Debit'
        };

        let allAccounts = [];

        function updateNormalBalance() {
            const type = document.getElementById('account-type').value;
            if (type && typeNormalBalance[type]) {
                document.getElementById('account-normal-balance').value = typeNormalBalance[type];
            }
        }

        async function loadAccounts() {
            const tbody = document.getElementById('accountsTableBody');
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-5"><div class="spinner-border spinner-border-sm text-primary"></div><span class="ms-2">Loading accounts...</span></td></tr>';

            try {
                allAccounts = await api.get('/accounts');
                filterAccounts();
            } catch (err) {
                api.showToast(err.message, 'error');
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-5 text-muted">Failed to load accounts. Please refresh.</td></tr>';
            }
        }

        function filterAccounts() {
            const search = document.getElementById('account-search').value.toLowerCase();
            const type = document.getElementById('filter-type').value;

            const filtered = allAccounts.filter(a => {
                const matchSearch = a.name.toLowerCase().includes(search) || a.code.toLowerCase().includes(search);
                const matchType = !type || a.type === type;
                return matchSearch && matchType;
            });

            renderAccounts(filtered);
        }

        function renderAccounts(accounts) {
            const tbody = document.getElementById('accountsTableBody');

            if (accounts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-5 text-muted">No accounts found matching your criteria.</td></tr>';
                return;
            }

            tbody.innerHTML = accounts.map(a => `
                <tr>
                    <td><span class="fw-500 text-muted">${a.code}</span></td>
                    <td>
                        <div class="fw-bold">${a.name}</div>
                        ${a.description ? `<div class="x-small text-muted mt-1">${a.description}</div>` : ''}
                    </td>
                    <td><span class="type-badge ${a.type.toLowerCase()}">${a.type}</span></td>
                    <td><span class="balance-pill ${a.normal_balance.toLowerCase()}">${a.normal_balance}</span></td>
                    <td>
                        <div class="action-icons">
                            <button class="action-btn" title="Edit" onclick="openAccountModal(${JSON.stringify(a).replace(/"/g, '&quot;')})">
                                <i class="bi bi-pencil-square"></i>
                            </button>
                            <button class="action-btn delete" title="Delete" onclick="deleteAccount(${a.id})">
                                <i class="bi bi-trash3"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function openAccountModal(account = null) {
            document.getElementById('accountModalTitle').innerText = account ? 'Edit Account' : 'Add Account';
            document.getElementById('account-id').value = account ? account.id : '';
            document.getElementById('account-code').value = account ? account.code : '';
            document.getElementById('account-code').readOnly = !!account;
            document.getElementById('account-name').value = account ? account.name : '';
            document.getElementById('account-type').value = account ? account.type : '';
            document.getElementById('account-normal-balance').value = account ? account.normal_balance : '';
            document.getElementById('account-description').value = account ? (account.description || '') : '';

            new bootstrap.Modal(document.getElementById('accountModal')).show();
        }

        document.getElementById('account-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('account-id').value;
            const data = {
                code: document.getElementById('account-code').value.trim(),
                name: document.getElementById('account-name').value.trim(),
                type: document.getElementById('account-type').value,
                normal_balance: document.getElementById('account-normal-balance').value,
                description: document.getElementById('account-description').value.trim() || null
            };

            try {
                if (id) {
                    await api.put(`/accounts/${id}`, data);
                    api.showToast('Account updated successfully', 'success');
                } else {
                    await api.post('/accounts', data);
                    api.showToast('Account created successfully', 'success');
                }
                bootstrap.Modal.getInstance(document.getElementById('accountModal')).hide();
                loadAccounts();
            } catch (err) {
                api.showToast(err.message, 'error');
            }
        };

        async function deleteAccount(id) {
            if (!confirm('Are you sure you want to delete this account? This action cannot be undone.')) return;
            try {
                await api.delete(`/accounts/${id}`);
                api.showToast('Account deleted successfully', 'success');
                loadAccounts();
            } catch (err) {
                api.showToast(err.message, 'error');
            }
        }

        // Initialize
        loadAccounts();
    </script>
</body>

</html>
